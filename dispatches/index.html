<title>WARDOGS Dispatches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<style>
:root{--gold:#e2ac2b;--ink:#2a2a2a;--ground:#0d0c0a;--panel:#16140f;--panel2:#1d1a14;--bone:#ffeee2;--muted:#8a7f6a;--line:rgba(255,238,226,.16);--bad:#d9573b;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Barlow","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--ground);color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.5}
body{min-height:100vh;display:flex;flex-direction:column}
.frame{position:fixed;inset:14px;border:1px solid var(--line);pointer-events:none;
  -webkit-mask:linear-gradient(#000,#000) top left/40px 40px no-repeat,linear-gradient(#000,#000) top right/40px 40px no-repeat,linear-gradient(#000,#000) bottom left/40px 40px no-repeat,linear-gradient(#000,#000) bottom right/40px 40px no-repeat;
  mask:linear-gradient(#000,#000) top left/40px 40px no-repeat,linear-gradient(#000,#000) top right/40px 40px no-repeat,linear-gradient(#000,#000) bottom left/40px 40px no-repeat,linear-gradient(#000,#000) bottom right/40px 40px no-repeat}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:28px 32px 8px;max-width:820px;width:100%;margin:0 auto}
.logo{width:180px;height:auto}
nav{display:flex;gap:18px;font-family:var(--display);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:13px}
nav a{color:var(--muted);text-decoration:none}nav a:hover,nav a:focus-visible{color:var(--gold);outline:none}nav a[aria-current]{color:var(--bone)}
main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:8px 32px 48px;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:20px;margin:0;text-align:center;color:var(--bone)}
h1 .sl{color:var(--gold)}
.sub{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:-16px}
.sub b{color:var(--gold);font-weight:600}
form{background:var(--panel);border:1px solid var(--line);padding:18px;display:grid;gap:12px;position:relative}
form::before{content:"";position:absolute;top:-2px;left:-2px;width:16px;height:16px;border:2px solid var(--gold);border-right:0;border-bottom:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:5px;font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
input,textarea{font:inherit;font-family:var(--body);font-size:15px;color:var(--bone);background:var(--ground);border:1px solid var(--line);padding:9px 11px;width:100%;border-radius:0}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{min-height:88px;resize:vertical}
.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.attach{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--muted);cursor:pointer}
.attach:hover{color:var(--gold)}.attach input{display:none}
.preview{display:none;align-items:center;gap:10px;font-size:13px;color:var(--muted)}.preview img{height:48px;border:1px solid var(--line)}
.preview button{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;text-decoration:underline}
.cta{background:var(--gold);color:var(--ink);font-family:var(--display);font-weight:700;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--gold);padding:10px 22px;font-size:14px;cursor:pointer}
.cta:hover,.cta:focus-visible{background:transparent;color:var(--gold);outline:none}.cta[disabled]{opacity:.5;cursor:wait}
.msg{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;min-height:1em}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--gold)}
.feed{display:flex;flex-direction:column;gap:14px}
.d{background:var(--panel);border:1px solid var(--line);padding:14px 16px;display:grid;gap:8px}
.d .who{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.d .who b{color:var(--gold);font-weight:700}.d .who time{color:var(--muted);font-size:11px}
.d p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.d img{max-width:100%;max-height:420px;object-fit:contain;display:block;border:1px solid var(--line);background:#000;cursor:zoom-in}
.d .del{justify-self:end;background:none;border:0;color:var(--muted);font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:11px;cursor:pointer}
.d .del:hover{color:var(--bad)}
.empty{text-align:center;color:var(--muted);font-family:var(--display);letter-spacing:.18em;text-transform:uppercase;padding:30px 0}
.more{align-self:center;background:transparent;color:var(--bone);border:1px solid var(--line);font-family:var(--display);font-weight:600;letter-spacing:.2em;text-transform:uppercase;padding:9px 20px;font-size:13px;cursor:pointer}
.more:hover{color:var(--gold);border-color:var(--gold)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;cursor:zoom-out;z-index:9}
.lightbox.on{display:flex}.lightbox img{max-width:96vw;max-height:96vh}
footer{padding:0 24px 22px;font-size:12px;color:var(--muted);text-align:center;opacity:.8}
@media (max-width:560px){header{padding:22px 20px 4px}main{padding:8px 20px 40px}.row{grid-template-columns:1fr}.logo{width:140px}}
</style>

<main>
  <h1><span class="sl">//</span> Dispatches <span class="sl">//</span></h1>
  <div class="sub"><b>&gt;</b>SQUAD.CHANNEL.OPEN &nbsp;·&nbsp; messages, updates and recon from the field</div>

  <form id="f" autocomplete="off">
    <div class="row">
      <label>Callsign<input id="author" maxlength="40" placeholder="e.g. Reaper-2" required></label>
      <label>Code word<input id="pass" type="password" maxlength="80" placeholder="ask in comms" required></label>
    </div>
    <label>Dispatch<textarea id="body" maxlength="2000" placeholder="Sitrep, plans for tonight, a screenshot worth bragging about…"></textarea></label>
    <div class="tools">
      <label class="attach">📷 Attach recon<input id="file" type="file" accept="image/*"></label>
      <div class="preview" id="preview"><img id="pimg" alt=""><span id="pinfo"></span><button type="button" id="pclear">drop it</button></div>
      <button class="cta" id="send" type="submit">Send dispatch</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </form>

  <section class="feed" id="feed" aria-live="polite"></section>
  <button class="more" id="more" hidden type="button">Older dispatches</button>
</main>
<div class="lightbox" id="lb"><img id="lbimg" alt=""></div>
<footer>Unofficial squad board. WARDOGS is a trademark of Bulkhead; logo from the Team17 press kit. Only people with the code word can post.</footer>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var feed=$('feed'),more=$('more'),msg=$('msg'),file=$('file'),preview=$('preview');
  var image=null,lastId=0;
  try{$('author').value=localStorage.getItem('wd-callsign')||'';$('pass').value=localStorage.getItem('wd-pass')||''}catch(e){}

  function say(t,cls){msg.textContent=t||'';msg.className='msg '+(cls||'')}
  function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function when(ms){var d=new Date(ms),diff=(Date.now()-ms)/1000;
    if(diff<60)return 'just now';if(diff<3600)return Math.floor(diff/60)+' min ago';if(diff<86400)return Math.floor(diff/3600)+' h ago';
    return d.toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
  function render(d,prepend){
    var el=document.createElement('article');el.className='d';el.dataset.id=d.id;
    el.innerHTML='<div class="who"><b>'+esc(d.author)+'</b><time datetime="'+new Date(d.created_at).toISOString()+'">'+when(d.created_at)+'</time></div>'
      +(d.body?'<p>'+esc(d.body)+'</p>':'')
      +(d.image_key?'<img loading="lazy" src="/api/recon/'+d.image_key+'" alt="Recon from '+esc(d.author)+'">':'')
      +'<button class="del" type="button">Burn after reading</button>';
    var img=el.querySelector('img');if(img)img.addEventListener('click',function(){$('lbimg').src=img.src;$('lb').classList.add('on')});
    el.querySelector('.del').addEventListener('click',function(){burn(d.id,el)});
    prepend?feed.prepend(el):feed.appendChild(el);
  }
  function load(before){
    fetch('/api/dispatches'+(before?'?before='+before:'')).then(function(r){return r.json()}).then(function(j){
      var list=j.dispatches||[];
      if(!before&&!list.length){feed.innerHTML='<div class="empty">Radio silence. No dispatches yet.</div>';more.hidden=true;return}
      if(!before)feed.innerHTML='';
      list.forEach(function(d){render(d,false);lastId=d.id});
      more.hidden=!j.more;
    }).catch(function(){feed.innerHTML='<div class="empty">Comms down. Try again shortly.</div>'});
  }
  more.addEventListener('click',function(){load(lastId)});
  $('lb').addEventListener('click',function(){$('lb').classList.remove('on')});

  // Shrink pictures in the browser so uploads stay quick and under the size limit.
  file.addEventListener('change',function(){
    var f=file.files[0];if(!f)return;
    var img=new Image(),url=URL.createObjectURL(f);
    img.onload=function(){
      var max=1600,s=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      image=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(url);
      $('pimg').src=image;$('pinfo').textContent=c.width+'×'+c.height+', ~'+Math.round(image.length*0.75/1024)+' KB';preview.style.display='flex';
    };
    img.onerror=function(){say('That file is not a picture.','bad')};
    img.src=url;
  });
  $('pclear').addEventListener('click',function(){image=null;file.value='';preview.style.display='none'});

  $('f').addEventListener('submit',function(e){
    e.preventDefault();
    var author=$('author').value.trim(),pass=$('pass').value,body=$('body').value.trim();
    if(!body&&!image){say('Empty dispatch. Say something or attach recon.','bad');return}
    $('send').disabled=true;say('Transmitting…');
    fetch('/api/dispatches',{method:'POST',headers:{'content-type':'application/json','x-squad-pass':pass},body:JSON.stringify({author:author,body:body,image:image})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
    .then(function(x){
      if(!x.ok){say(x.j.error||'Transmission failed.','bad');return}
      try{localStorage.setItem('wd-callsign',author);localStorage.setItem('wd-pass',pass)}catch(e){}
      var empty=feed.querySelector('.empty');if(empty)empty.remove();
      render(x.j.dispatch,true);$('body').value='';$('pclear').click();say('Dispatch sent. Command acknowledges.','ok');
    }).catch(function(){say('Comms down. Try again shortly.','bad')})
    .finally(function(){$('send').disabled=false});
  });
  function burn(id,el){
    if(!confirm('Burn this dispatch? It is gone for everyone.'))return;
    fetch('/api/dispatches/'+id,{method:'DELETE',headers:{'x-squad-pass':$('pass').value}}).then(function(r){
      if(r.status===204){el.remove();if(!feed.children.length)load()}else r.json().then(function(j){say(j.error||'Could not burn it.','bad')})
    });
  }
  load();
})();
</script>
